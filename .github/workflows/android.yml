name: Android
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  promotion:
    runs-on: ubuntu-latest
    steps:
      - name: Check production promotion source
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = main ] && [ "$SOURCE_BRANCH" != dev ]; then
            echo 'Production changes must be promoted from dev.'
            exit 1
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew -p buildSrc test --no-daemon --no-configuration-cache
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --no-configuration-cache
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/test-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-device-tests
          path: |
            app/build/reports/androidTests/
            app/build/reports/device-screenshots/
            app/build/reports/device-logcat.txt
            app/build/outputs/connected_android_test_additional_output/
